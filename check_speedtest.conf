/*
 * Icinga 2 CheckCommand definition for check_speedtest.py
 *
 * The timeout must stay bigger than the plugin one (90 seconds by default):
 * raise both with speedtest_timeout and the timeout attribute if needed.
 */

object CheckCommand "speedtest" {
	command = [ PluginDir + "/check_speedtest.py" ]

	timeout = 2m

	arguments = {
		"-w" = {
			value = "$speedtest_download_warning$"
			description = "Download warning level in Mbit/s"
		}
		"-c" = {
			value = "$speedtest_download_critical$"
			description = "Download critical level in Mbit/s"
		}
		"-W" = {
			value = "$speedtest_upload_warning$"
			description = "Upload warning level in Mbit/s"
		}
		"-C" = {
			value = "$speedtest_upload_critical$"
			description = "Upload critical level in Mbit/s"
		}
		"-m" = {
			value = "$speedtest_download_max$"
			description = "Maximum download level in Mbit/s for the connection"
		}
		"-M" = {
			value = "$speedtest_upload_max$"
			description = "Maximum upload level in Mbit/s for the connection"
		}
		"--server" = {
			value = "$speedtest_server$"
			description = "Server ID to test against"
		}
		"--source" = {
			value = "$speedtest_source$"
			description = "Source IP address to bind to"
		}
		"--command" = {
			value = "$speedtest_command$"
			description = "Speedtest command or path"
		}
		"--timeout" = {
			value = "$speedtest_timeout$"
			description = "Speedtest command timeout in seconds"
		}
		"--from-file" = {
			value = "$speedtest_from_file$"
			description = "Read the speedtest JSON output from a file instead of running the test"
		}
		"--max-age" = {
			value = "$speedtest_max_age$"
			description = "With speedtest_from_file, exit with UNKNOWN if the file is older than the given minutes"
		}
		"--python" = {
			set_if = "$speedtest_python$"
			description = "Use the Python speedtest-cli command"
		}
		"--ookla" = {
			set_if = "$speedtest_ookla$"
			description = "Use the Ookla speedtest command, accepting its license and GDPR terms"
		}
		"--secure" = {
			set_if = "$speedtest_secure$"
			description = "Use HTTPS with speedtest.net servers (speedtest-cli only)"
		}
		"--no-download" = {
			set_if = "$speedtest_no_download$"
			description = "Do not perform the download test (speedtest-cli only)"
		}
		"--no-upload" = {
			set_if = "$speedtest_no_upload$"
			description = "Do not perform the upload test (speedtest-cli only)"
		}
		"--always-ok" = {
			set_if = "$speedtest_always_ok$"
			description = "Always exit with OK"
		}
	}
}

/*
 * Example service, running the test every hour on the host checked:
 *
 * apply Service "speedtest" {
 * 	check_command = "speedtest"
 * 	check_interval = 1h
 * 	retry_interval = 15m
 *
 * 	vars.speedtest_download_warning = 50
 * 	vars.speedtest_download_critical = 20
 * 	vars.speedtest_upload_warning = 10
 * 	vars.speedtest_upload_critical = 5
 *
 * 	assign where host.vars.speedtest
 * }
 */
